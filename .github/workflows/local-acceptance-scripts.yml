name: Local acceptance script validation

on:
  pull_request:
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'test/low_memory_acceptance_script_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/main.dart'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/scripts/run-low-memory-acceptance.sh'
      - '.github/scripts/run-low-memory-acceptance-ci.sh'
      - '.github/workflows/flutter-quality.yml'
      - '.github/workflows/local-acceptance-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'test/low_memory_acceptance_script_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/main.dart'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/scripts/run-low-memory-acceptance.sh'
      - '.github/scripts/run-low-memory-acceptance-ci.sh'
      - '.github/workflows/flutter-quality.yml'
      - '.github/workflows/local-acceptance-scripts.yml'

permissions:
  contents: read

jobs:
  validate-acceptance-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and analyze probes
        run: |
          dart format --output=none --set-exit-if-changed tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
          flutter analyze
      - name: Test acceptance probes
        run: flutter test test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart test/low_memory_acceptance_script_test.dart

  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell acceptance files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            './tools/local_acceptance/Invoke-PrivacyStampHighResolutionAcceptance.ps1',
            './tools/local_acceptance/PrivacyStampAcceptanceEvidence.psm1',
            './tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Test evidence helpers
        shell: pwsh
        run: ./tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1

  android-low-memory-acceptance:
    name: Android synthetic high-resolution low-memory acceptance
    # The standard Ubuntu runner exposed no usable /dev/kvm in run
    # 32816566466, so API 35 x86_64 stayed offline until the boot timeout.
    # Use GitHub's standard Intel macOS runner so the Android emulator can use
    # host virtualization without weakening the x86_64 / 1-2 GiB acceptance.
    runs-on: macos-15-intel
    # The 2 GiB Google APIs image can spend close to 15 minutes draining first-
    # boot broadcasts after sys.boot_completed=1. This job timeout covers that
    # bounded infrastructure stabilization plus the unchanged 12-minute A-C
    # acceptance wall clock; it does not extend the app acceptance itself.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Prepare macOS acceptance tools
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          brew install coreutils
          command -v gtimeout
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build production and integration-test debug APKs
        shell: bash
        run: |
          set -euxo pipefail
          apk_dir=build/app/outputs/flutter-apk
          flutter build apk --debug
          cp "$apk_dir/app-debug.apk" "$apk_dir/app-debug-main.apk"
          flutter build apk --debug --target=integration_test/synthetic_low_memory_acceptance_test.dart
          cp "$apk_dir/app-debug.apk" "$apk_dir/app-debug-integration.apk"
          cp "$apk_dir/app-debug-main.apk" "$apk_dir/app-debug.apk"
          test -s "$apk_dir/app-debug-main.apk"
          test -s "$apk_dir/app-debug-integration.apk"
      - name: Prepare Android diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p .ci-logs/android
          printf 'Android acceptance started at %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee .ci-logs/android/progress.log
          printf 'Runner: %s\n' "${RUNNER_NAME:-unknown}" | tee -a .ci-logs/android/progress.log
          df -h / | tee .ci-logs/android/disk-before-avd.txt

      - name: Run synthetic acceptance on low-memory API 35 Google APIs AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Issue #17 permits a 1-2 GiB guest. The 1536MB run entered severe
          # system-wide pressure before A:start and lmkd killed unrelated system
          # processes, so use the permitted 2 GiB upper bound while keeping the
          # same API 35 Google APIs image, 48MP fixture, and all app assertions.
          disk-size: 2048M
          ram-size: 2048
          heap-size: 256M
          cores: 2
          force-avd-creation: true
          # Run 33314277128 reached an online ADB device but API 35 had not set
          # sys.boot_completed after the action's 600-second cold-boot limit.
          # This extends infrastructure boot wait only; the acceptance script's
          # own 12-minute wall-clock and all Issue #17 assertions stay unchanged.
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -lowram
          script: bash .github/scripts/run-low-memory-acceptance-ci.sh

      - name: Collect Android diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p .ci-logs/android
          timeout_bin="$(command -v gtimeout || command -v timeout || true)"
          printf 'Collecting Android diagnostics at %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a .ci-logs/android/progress.log
          df -h / > .ci-logs/android/disk-after-avd.txt 2>&1
          collect_with_timeout() {
            local output="$1"
            shift
            printf 'Collecting %s at %s\n' "$output" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a .ci-logs/android/progress.log
            if [[ -n "$timeout_bin" ]]; then
              "$timeout_bin" --signal=TERM --kill-after=5s 30s "$@" > "$output" 2>&1
            else
              "$@" > "$output" 2>&1
            fi
            local status=$?
            printf 'Collected %s with exit %s at %s\n' "$output" "$status" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a .ci-logs/android/progress.log
            return 0
          }
          collect_with_timeout .ci-logs/android/adb-devices.txt adb devices -l
          collect_with_timeout .ci-logs/android/getprop.txt adb shell getprop
          collect_with_timeout .ci-logs/android/proc-meminfo.txt adb shell cat /proc/meminfo
          collect_with_timeout .ci-logs/android/dumpsys-meminfo.txt adb shell dumpsys meminfo com.privacy_stamp
          collect_with_timeout .ci-logs/android/logcat.txt adb logcat -d -v threadtime
          printf 'Diagnostics collection ended at %s.\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a .ci-logs/android/progress.log

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-low-memory-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .ci-logs/android/
