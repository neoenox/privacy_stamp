name: Format preview (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format changed Dart sources
        run: |
          dart format --output=write \
            lib/features/redaction/detection/detector_service.dart \
            lib/features/redaction/detection/text_detector.dart \
            lib/features/redaction/models/redaction_models.dart \
            test/face_detection_test.dart \
            test/text_detection_test.dart \
            test/widget_test.dart
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            lib/features/redaction/detection/detector_service.dart
            lib/features/redaction/detection/text_detector.dart
            lib/features/redaction/models/redaction_models.dart
            test/face_detection_test.dart
            test/text_detection_test.dart
            test/widget_test.dart
