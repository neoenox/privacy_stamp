name: Format preview

on:
  push:
    branches:
      - fix/post-face-detection-ci

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Show canonical dart format diff
        shell: bash
        run: |
          dart format .
          git diff --no-color
          git diff --quiet
