name: Temporary format probes after pub get

on:
  push:
    branches:
      - fix/post-face-detection-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-face-detection-ci
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format acceptance probes
        run: dart format tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
      - name: Commit formatting if needed
        run: |
          git add tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
          if git diff --cached --quiet; then
            echo "No probe formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format acceptance probes after pub get"
          git push origin HEAD:fix/post-face-detection-ci
