name: Formatter snapshot (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-snapshot.yml"
      - "**/*.dart"

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
      - name: Format and capture patch
        shell: bash
        run: |
          git ls-files -z "*.dart" | xargs -0 dart format
          git diff -- > format.patch
          git diff --stat
          cat format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: error
