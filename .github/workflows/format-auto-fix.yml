name: Temporary Dart formatter fix

on:
  push:
    branches: [fix/format-gate-issue60-20261128]
    paths:
      - ".github/workflows/format-auto-fix.yml"
      - "**/*.dart"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == "neoenox/privacy_stamp" && github.ref == "refs/heads/fix/format-gate-issue60-20261128"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
      - name: Format tracked Dart files
        shell: bash
        run: git ls-files -z "*.dart" | xargs -0 dart format
      - name: Commit formatter output on the PR branch
        shell: bash
        run: |
          if git diff --quiet -- "*.dart"; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- "*.dart"
          git commit -m "fix: apply Dart formatter to issue 60 files"
          git push origin HEAD:${{ github.ref_name }}
