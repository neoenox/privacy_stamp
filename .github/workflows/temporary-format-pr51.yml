name: Temporary format PR 51

on:
  push:
    branches:
      - fix/post-face-detection-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-face-detection-ci
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply Dart formatter
        run: dart format .
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply dart format"
          git push origin HEAD:fix/post-face-detection-ci
