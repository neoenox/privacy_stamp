name: privacy_stamp
description: "Privacy-preserving image redaction stamp MVP"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# On Windows, build-name is used as the major, minor, and patch parts
# of the product file version while build-number is used as the build suffix.
version: 1.0.0+5

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider using `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below
# to the latest available. Run `flutter pub outdated` to see which versions
# are available.
dependencies:
  flutter:
    sdk: flutter

  file_picker: ^10.3.10
  image: ^4.5.4
  shared_preferences: ^2.5.3
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information on deactivating specific lints and
  # activating others.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/publishing
# For information on the Flutter-specific part of this file, see the
# following page: https://docs.flutter.dev/deployment/the-build-process

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included in the application, so that you can use the icons in
  # the Material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - test/fixtures/synthetic-high-res-avd.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://docs.flutter.dev/development/platform-integration/images

  # For details regarding adding assets from package dependencies, see
  # https://docs.flutter.dev/development/packages-and-plugins/using-packages

  # To add custom fonts to your application, add a fonts section here, in
  # the "flutter" section. Each entry in this list should have a "family"
  # key with the font family name, and a "fonts" key with a list giving the
  # path and weight for the font. For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro-Regular.ttf
  #       - asset: fonts/TrajanPro-Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://docs.flutter.dev/development/platform-integration/fonts
